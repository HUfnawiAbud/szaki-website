# ÚJ (a Szaki app "DISCOVERY POST TELJES MEGOSZTÁSA" kérésére – lásd
# netlify/functions/post.js fejléc-kommentjét a teljes háttérért): eddig
# ez egyetlen, statikus index.html fájlból állt, Netlify Function/build
# lépés nélkül. A Discovery poszt megosztáshoz szükség van egy publikus,
# POSZTONKÉNT dinamikus Open Graph előnézeti oldalra
# (https://szakiapp.com/post/{id}) – ez csak szerver-oldalon (Netlify
# Function) állítható elő, mert egy statikus HTML fájl nem tudná
# posztonként eltérő <meta property="og:..."> címkékkel válaszolni.
[build]
  functions = "netlify/functions"

# ÚJ (2026-10, főoldal-átrendezés): az "Alkalmazás letöltése" gombok ezen a
# két rövid linken át mennek az áruházba. Így a Netlify Observability
# naplójában (302-es /go/ios és /go/android sorok) megszámolható, hányan
# kattintottak a letöltésre, süti és követőkód nélkül.
[[redirects]]
  from = "/go/ios"
  to = "https://apps.apple.com/app/id6811597956"
  status = 302
  force = true

[[redirects]]
  from = "/go/android"
  to = "https://play.google.com/store/apps/details?id=com.szakiapp.szaki"
  status = 302
  force = true

# A /post/{id} útvonalat a post.js Function szolgálja ki – a `:splat` a
# `/post/` UTÁNI részt (a poszt-azonosítót) adja tovább a függvénynek.
[[redirects]]
  from = "/post/*"
  to = "/.netlify/functions/post/:splat"
  status = 200

# ÚJ (2026-09-27, a Szaki app "Szakember profil megosztása" kérésére): a
# https://szakiapp.com/pro/{id} profil-megosztó linket a pro.js Function
# szolgálja ki (lásd netlify/functions/pro.js fejléc-kommentjét).
[[redirects]]
  from = "/pro/*"
  to = "/.netlify/functions/pro/:splat"
  status = 200

# ÚJ (2026-10-19, a tulajdonos kérésére – "ha ranyomok hogy download ott a
# weboldalra dob ugye lehet az a bah"): a hirdetések "Letöltés" gombja a
# /letolt.html oldalra mutat, ami operációs rendszer szerint azonnal az App
# Store-ba / Google Playre irányít (kampány-tokennel). A /letolt rövid cím is él.
[[redirects]]
  from = "/letolt"
  to = "/letolt.html"
  status = 200

# ÚJ (2026-10-19): a kód-statisztika oldal (influenszer / partner). Eddig csak az
# app-repó website/ mappájában volt meg, az élő oldalon nem. A statisztikát a
# `promoStats` Cloud Function adja (ugyanaz a CLOUD_FUNCTION_BASE, mint a post.js /
# pro.js függvényekben) – Netlify-on proxyzzuk, hogy a böngésző ugyanarról a
# domainről hívhassa (`/api/promo-stats?c=KÓD&t=TOKEN`).
[[redirects]]
  from = "/kod"
  to = "/kod.html"
  status = 200

[[redirects]]
  from = "/api/promo-stats"
  to = "https://us-central1-szaki-4d32e.cloudfunctions.net/promoStats"
  status = 200
  force = true

# ÚJ (2026-10-22): a nyomtatott QR-kódok (szórólap, matrica) a
# https://szakiapp.com/letoltes címre mutatnak – ez is a /letolt.html
# operációsrendszer-felismerő áruház-átirányító oldalt szolgálja ki.
[[redirects]]
  from = "/letoltes"
  to = "/letolt.html"
  status = 200

# ÚJ (2026-10-22): a szerződésekben (pl. influenszer-megállapodás 7.1) szereplő
# szakiapp.com/adatvedelem és szakiapp.com/aszf rövid címek. Az index.html
# az útvonalból nyitja meg a megfelelő nézetet (initialRoute).
[[redirects]]
  from = "/adatvedelem"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/aszf"
  to = "/index.html"
  status = 200
