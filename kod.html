<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Kódstatisztika – Szaki</title>
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* ÚJ (2026-10-05): a kampány-/influenszer-kód tulajdonosának átlátható
     statisztikája. Az adatot a szerver számolja (functions/index.js promoStats),
     ugyanazt látja a Szaki admin és a kód tulajdonosa. Személyes adat nincs benne. */
  :root { --bg:#0A0E14; --surface:#121922; --line:rgba(255,255,255,0.08); --text:#F2F6F9; --soft:#A7B3BF; --faint:#6E7A87; --accent:#B2D5E5;
    --good:#7BD3A0; --warn:#E8C77A; --bad:#E88A8A;
    --display:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--body); line-height:1.55; -webkit-font-smoothing:antialiased; }
  header { border-bottom:1px solid var(--line); }
  .wrap { max-width:860px; margin:0 auto; padding:0 16px; }
  header .wrap { display:flex; align-items:center; height:64px; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; font-family:var(--display); font-weight:800; font-size:20px; }
  .brand img { width:30px; height:30px; border-radius:8px; }
  main { padding:36px 0 64px; }
  .eyebrow { color:var(--faint); font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px; }
  h1 { font-family:var(--display); font-weight:800; font-size:clamp(30px,6vw,44px); line-height:1.1; margin:0 0 6px; letter-spacing:.01em; }
  .sub { color:var(--soft); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:28px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .tile .label { color:var(--faint); font-size:13px; }
  .tile .value { font-family:var(--display); font-weight:800; font-size:28px; font-variant-numeric:tabular-nums; margin-top:4px; }
  .tile.hero { border-color:rgba(123,211,160,.35); }
  .tile.hero .value { color:var(--good); }
  h2 { font-family:var(--display); font-weight:700; font-size:18px; margin:8px 0 12px; }
  .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--faint); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.06em; background:var(--surface); }
  tr:last-child td { border-bottom:none; }
  td.num { text-align:right; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .p-paid { background:rgba(123,211,160,.14); color:var(--good); }
  .p-trial { background:rgba(178,213,229,.12); color:var(--accent); }
  .p-no { background:rgba(255,255,255,.06); color:var(--faint); }
  .p-ref { background:rgba(232,138,138,.14); color:var(--bad); }
  .p-pend { background:rgba(232,199,122,.14); color:var(--warn); }
  .note { color:var(--faint); font-size:13px; margin-top:16px; }
  .msg { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; color:var(--soft); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="https://szakiapp.com/"><img src="/apple-touch-icon.png" alt="">Szaki</a></div></header>
<main><div class="wrap" id="app">
  <div class="msg">Statisztika betöltése…</div>
</div></main>
<script>
(function () {
  var app = document.getElementById("app");
  var q = new URLSearchParams(location.search);
  var c = q.get("c") || "", t = q.get("t") || "";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function money(n, cur) { return new Intl.NumberFormat("hu-HU").format(Math.round(n || 0)) + " " + (cur === "HUF" || !cur ? "Ft" : cur); }
  function fail(text) { app.innerHTML = '<div class="msg">' + esc(text) + "</div>"; }
  if (!c || !t) { fail("Hiányos link. Kérd el újra a Szakitól a kódod statisztika-linkjét."); return; }
  fetch("/api/promo-stats?c=" + encodeURIComponent(c) + "&t=" + encodeURIComponent(t), { cache: "no-store" })
    .then(function (r) { if (r.status === 404) throw new Error("nf"); if (!r.ok) throw new Error("err"); return r.json(); })
    .then(render)
    .catch(function (e) { fail(e.message === "nf" ? "Ez a link nem érvényes (lehet, hogy új linket kaptál)." : "Most nem sikerült betölteni – próbáld újra pár perc múlva."); });

  var STATUS = {
    paid: ['p-paid', "Sikeres – fizetett"],
    trial: ['p-trial', "Ingyenes hónapban"],
    notConverted: ['p-no', "Nem fizetett"],
    refunded: ['p-ref', "Visszatérítve"]
  };
  function render(d) {
    var T = d.totals || {};
    var cur = (d.rows && d.rows[0] && d.rows[0].currency) || "HUF";
    var inf = d.codeType === "influencer" && d.rewardPercent > 0;
    var h = "";
    h += '<p class="eyebrow">Kódstatisztika' + (d.ownerName ? " · " + esc(d.ownerName) : "") + "</p>";
    h += "<h1>" + esc(d.code) + "</h1>";
    h += '<p class="sub">' + (d.freeUntil ? "Ingyenes Szaki a kóddal eddig: " + esc(new Date(d.freeUntil).toLocaleDateString("hu-HU")) : d.freeTrialDays ? esc(d.freeTrialDays) + " nap ingyenes Szaki a kóddal" : "Szaki kampánykód") +
      (inf ? (d.rewardMaxPaidEvents ? " · jutalom: az első " + esc(d.rewardMaxPaidEvents) + " sikeres fizetés " + esc(d.rewardPercent) + "%-a" : " · jutalom: az első havi fizetés " + esc(d.rewardPercent) + "%-a") : "") + (d.active ? "" : " · a kód már nem aktív") + "</p>";
    h += '<div class="grid">';
    h += '<div class="tile hero"><div class="label">Sikeres (fizetett)</div><div class="value">' + (T.successful || 0) + "</div></div>";
    h += '<div class="tile"><div class="label">Beváltások összesen</div><div class="value">' + (T.redemptions || 0) + "</div></div>";
    h += '<div class="tile"><div class="label">Még ingyenes hónapban</div><div class="value">' + (T.inTrial || 0) + "</div></div>";
    if (inf) {
      h += '<div class="tile"><div class="label">Jutalom összesen</div><div class="value">' + money(T.rewardEarned, cur) + "</div></div>";
      h += '<div class="tile"><div class="label">Kifizetve</div><div class="value">' + money(T.rewardPaid, cur) + "</div></div>";
      h += '<div class="tile"><div class="label">Kifizetésre vár</div><div class="value">' + money(T.rewardPending, cur) + "</div></div>";
    }
    h += "</div>";
    h += "<h2>Beváltások</h2>";
    if (!d.rows || !d.rows.length) {
      h += '<div class="msg">Még senki nem váltotta be a kódot.</div>';
    } else {
      h += '<div class="table-wrap"><table><thead><tr><th>Beváltva</th><th>Eszköz</th><th>Állapot</th><th>Első fizetés</th>' + (d.rewardMaxPaidEvents ? "<th>Fizetések</th>" : "") +
        (inf ? '<th class="num">Jutalom</th><th>Kifizetés</th>' : "") + "</tr></thead><tbody>";
      d.rows.forEach(function (r) {
        var st = STATUS[r.status] || STATUS.trial;
        h += "<tr><td>" + esc(r.date) + "</td><td>" + esc(r.platform) + '</td><td><span class="pill ' + st[0] + '">' + st[1] + "</span></td>";
        h += "<td>" + (r.firstPaid != null ? esc(r.convertedDate || "") + " · " + money(r.firstPaid, r.currency) : "–") + "</td>";
        // ÚJ (2026-10-23): a jutalék az első 3 sikeres fizetésre jár – hányadiknál tart.
        if (d.rewardMaxPaidEvents) h += "<td>" + (r.paidEvents != null ? esc(r.paidEvents) + " / " + esc(r.maxPaidEvents || d.rewardMaxPaidEvents) : "–") + "</td>";
        if (inf) {
          h += '<td class="num">' + (r.reward ? money(r.reward, r.currency) : "–") + "</td>";
          h += "<td>" + (r.payout === "paid" ? '<span class="pill p-paid">Kifizetve</span>' : r.payout === "pending" ? '<span class="pill p-pend">Függőben</span>' : "–") + "</td>";
        }
        h += "</tr>";
      });
      h += "</tbody></table></div>";
    }
    h += '<p class="note">"Sikeres" = az ingyenes hónap után ténylegesen fizetett az App Store-ban vagy a Google Playen. A számokat a Szaki szervere számolja a valódi áruházi fizetésekből – ugyanezt látja a Szaki is. Teszt-vásárlások nem számítanak. Frissítve: ' +
      esc(new Date(d.generatedAt).toLocaleString("hu-HU")) + ".</p>";
    app.innerHTML = h;
  }
})();
</script>
</body>
</html>
